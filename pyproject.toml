[project]
name = "tender-visual-rag"
version = "0.1.0"
description = "RAG visual (PixelRAG / Qwen3-VL) por expediente de Keedio Tender Radar"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.5",
  # El motor real (PixelRAG + Qwen3-VL) se instala aparte en el entorno de despliegue:
  #   pip install 'pixelrag[embed,index,serve,pdf]'
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# S603/subprocess: backend real ejecuta el CLI de pixelrag a propósito.

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
